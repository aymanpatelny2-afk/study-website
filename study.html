<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Deck</title><script src="theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@800&display=swap">
<style>
:root{--bg:#17120f;--surface:#241c18;--cream:#f6ecd9;--muted:#cdbfa9;--yellow:#f9c733;--pink:#ff8ee0;--teal:#3fdcc8;--ink:#241812;--shadow:#000;--f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--f-body:"DM Sans",system-ui,sans-serif;--f-han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#3a2a3f 0%,var(--bg) 60%) var(--bg);color:var(--cream);font-family:var(--f-body);font-size:15px;padding:20px 16px 40px;min-height:100vh}
.wrap{max-width:1240px;margin-inline:auto;display:grid;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.menu{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--cream);text-decoration:none}
.menu i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--yellow);color:var(--ink);font-style:normal;border:2px solid var(--cream);box-shadow:3px 3px 0 var(--shadow)}
.seg{display:flex;border:2px solid var(--cream);border-radius:999px;padding:3px;gap:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.seg .on{background:var(--yellow);color:var(--ink)}
.board{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.board{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:2px solid var(--cream);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.chip.on{background:#3a2d36}.chip b{font-family:var(--f-display);font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--cream);display:inline-block}
.d-teal{background:var(--teal)}.d-pink{background:var(--pink)}.d-new{background:var(--surface)}
.stage{position:relative;padding:14px 14px 22px}
.deck{position:relative;aspect-ratio:4/3;max-height:460px;width:100%;perspective:1400px}
.sheet{position:absolute;inset:0;border:3px solid var(--cream);border-radius:28px;box-shadow:8px 8px 0 var(--shadow)}
.under1{background:var(--yellow);transform:rotate(4deg) translate(10px,4px)}.under2{background:var(--teal);transform:rotate(-3deg) translate(-8px,6px)}
.card{position:absolute;inset:0;transform:rotate(-1.2deg);transition:transform .38s cubic-bezier(.3,.7,.3,1),opacity .38s;cursor:pointer;border:0;background:none;padding:0;text-align:inherit;transform-style:preserve-3d;touch-action:none;user-select:none}
.card.drag{transition:none;cursor:grabbing}
.card.pop{animation:pop .3s cubic-bezier(.3,.7,.3,1)}@keyframes pop{from{transform:rotate(-1.2deg) scale(.92);opacity:.4}}
.card:active .inner{box-shadow:3px 3px 0 var(--shadow);transform:translate(5px,5px)}
.card.flipped:active .inner{transform:rotateY(180deg)}
.card.fly-r{transform:translate(120%,-10%) rotate(18deg);opacity:0}.card.fly-l{transform:translate(-120%,-10%) rotate(-18deg);opacity:0}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1),box-shadow .1s;border-radius:28px;box-shadow:8px 8px 0 var(--shadow)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--cream);border-radius:28px;display:grid;place-items:center;align-content:center;gap:8px;color:var(--ink);overflow:hidden}
.front{background:var(--pink)}.back{background:var(--cream);transform:rotateY(180deg)}
.tag{position:absolute;top:14px;left:50%;transform:translateX(-50%) rotate(-2deg);background:#fff;color:var(--ink);font-weight:700;font-size:12px;padding:4px 12px;border-radius:999px;border:2px solid var(--ink)}
.han{font-family:var(--f-han);font-weight:800;font-size:clamp(88px,18vw,150px);line-height:1;text-align:center}
.han.s{font-size:clamp(56px,12vw,96px)}.han.x{font-size:clamp(30px,6.5vw,52px)}
.hint{font-size:13px;font-weight:500;opacity:.75}
.pin{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,64px);line-height:1}
.eng{font-size:clamp(18px,3.5vw,26px);font-weight:700;text-align:center;padding-inline:20px}
.back .han,.back .han.s{font-size:44px;opacity:.85}.back .han.x{font-size:24px}
.spk{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--yellow);display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 20px;border:3px solid var(--cream);border-radius:999px;font-weight:800;font-size:15px;box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s;color:var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shadow)}.btn:disabled{opacity:.45;cursor:default}
.btn.no{background:var(--pink)}.btn.yes{background:var(--teal)}.btn.ghost{background:var(--surface);color:var(--cream)}.btn.sm{min-height:36px;padding:6px 14px;font-size:13px;box-shadow:3px 3px 0 var(--shadow)}
kbd{font-family:var(--f-body);font-size:11px;font-weight:700;background:rgba(36,24,18,.18);padding:2px 6px;border-radius:6px}.ghost kbd{background:rgba(246,236,217,.15)}
.done{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:12px;text-align:center;background:var(--yellow);color:var(--ink);border:3px solid var(--cream);border-radius:28px;box-shadow:8px 8px 0 var(--shadow);padding:20px}
.done h2{font-family:var(--f-display);font-size:34px;margin:0}.done.show{display:grid}
.side{display:grid;gap:20px}
.panel{border:3px solid var(--cream);border-radius:24px;background:var(--surface);padding:16px;box-shadow:6px 6px 0 var(--shadow);min-width:0}
.panel h3{margin:0 0 12px;font-family:var(--f-display);font-size:18px}
.mochi-wrap{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.bubble{position:relative;background:var(--cream);color:var(--ink);padding:10px 12px;border-radius:16px;font-weight:700;font-size:14px;min-height:52px;display:grid;align-items:center}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--cream);border-left:0}
#mochi{width:120px;height:auto;transform-origin:50% 90%}
#mochi.bounce{animation:bounce .6s}#mochi.shake{animation:shake .5s}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16px) scale(.95,1.08)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.xp{margin-top:14px}.xp small{color:var(--muted);font-weight:500}
.bar{height:14px;border:2px solid var(--cream);border-radius:999px;overflow:hidden;background:var(--bg);margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink));width:7%;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px}
.grid i{aspect-ratio:1;border-radius:50%;border:2px solid rgba(246,236,217,.35)}
.grid i.k{background:var(--teal);border-color:var(--cream)}.grid i.u{background:var(--pink);border-color:var(--cream)}
.grid i.cur{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.all{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.all>div{border:2px solid var(--cream);border-radius:16px;padding:12px;text-align:center;font-size:13px;color:var(--cream)}
.all>div>div:first-child{font-family:var(--f-han);font-size:32px;font-weight:800}.all .k{background:#1f6e66}.all .u{background:#8a3a63}.all .n{background:var(--surface)}
@media(min-width:1100px){.deck{max-height:580px}.han{font-size:clamp(120px,13vw,200px)}.han.s{font-size:clamp(80px,9vw,130px)}.board{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.btn{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
<div class="top"><a class="menu" href="index.html"><i aria-hidden="true">←</i> Menu</a><div class="seg" aria-label="Mode"><button data-v="s" class="on">Study Mode</button><button data-v="a">All Cards</button></div></div>
<div class="board" id="board">
<section class="panel stage" aria-label="Flashcards">
<div class="chips"><button class="chip" data-m="k"><span class="dot d-teal"></span>Known <b id="nK">0</b></button><button class="chip" data-m="d"><span class="dot d-pink"></span>Don't know <b id="nU">0</b></button><button class="chip" data-m="n"><span class="dot d-new"></span>New <b id="nN">150</b></button></div>
<div class="deck" id="deck"><div class="sheet under2" id="u2"></div><div class="sheet under1" id="u1"></div>
<button class="card" id="card" aria-label="Flashcard, press to flip"><div class="inner"><div class="face front"><span class="tag">Custom</span><div class="han" id="han"></div><div class="hint">Tap to flip · Space</div></div>
<div class="face back"><span class="tag">Custom</span><div class="han" id="han2"></div><div class="pin" id="pin"></div><div class="eng" id="eng"></div><span class="spk" id="spk" role="button" aria-label="Play pronunciation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241812" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#241812"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></span></div></div></button>
<div class="done" id="done"><h2 id="dh">Round done!</h2><div id="doneTxt"></div><button class="btn ghost" id="again">↺ Go again</button></div></div>
<div class="actions"><button class="btn ghost" id="undo">↶ Undo</button><button class="btn no" id="no">✗ Don't know <kbd>←</kbd></button><button class="btn yes" id="yes">✓ I know this <kbd>→</kbd></button></div>
</section>
<aside class="side"><section class="panel"><div class="mochi-wrap">
<svg id="mochi" viewBox="0 0 140 120" role="img" aria-label="Mochi the study pet"><ellipse cx="70" cy="110" rx="46" ry="6" fill="#000" opacity=".35"/><path id="msp" d="M70 12c4 0 7 3 6 7-1 3-3 5-6 5s-5-2-6-5c-1-4 2-7 6-7z" stroke="#f6ecd9" stroke-width="3"/><path id="mbd" d="M18 70c0-30 24-48 52-48s52 18 52 48c0 24-20 38-52 38S18 94 18 70z" stroke="#f6ecd9" stroke-width="4"/><ellipse cx="38" cy="82" rx="9" ry="6" fill="#ff8ee0" opacity=".85"/><ellipse cx="102" cy="82" rx="9" ry="6" fill="#ff8ee0" opacity=".85"/><g id="eyes" stroke="#241812" stroke-width="4" stroke-linecap="round" fill="none"><path d="M44 66q6-8 12 0"/><path d="M84 66q6-8 12 0"/></g><path id="mouth" d="M58 82q12 12 24 0" stroke="#241812" stroke-width="4" stroke-linecap="round" fill="none"/></svg>
<div class="bubble" id="bubble">Ready when you are!</div></div>
<div class="xp"><div><b id="xpTxt"></b> <small id="xpT"></small></div><div class="bar" aria-hidden="true"><i id="xpBar"></i></div><small id="xpNext"></small></div></section>
<section class="panel"><h3>All words</h3><div class="grid" id="grid"></div>
<div class="legend"><span><i class="dot d-teal"></i>Known</span><span><i class="dot d-pink"></i>Don't know</span><span><i class="dot d-new"></i>New</span></div>
<div class="tools"><button class="btn ghost sm" id="sh">⇄ Shuffle</button><button class="btn ghost sm" id="rs">↺ Reset progress</button></div></section></aside>
</div>
<section class="panel" id="allv" hidden><div class="all" id="all"></div></section>
</div>
<script>
(function(){
var DK=new URLSearchParams(location.search).get("d")||"",DS=[];try{DS=JSON.parse(localStorage.getItem("decks")||"[]")}catch(e){}
var DECK=DS.filter(function(x){return x.id==DK})[0]||{name:"Deck",cards:[]};document.title=DECK.name;
var D=DECK.cards.map(function(a,i){return{id:i,h:a[0],p:a[1],m:a[2]}});
var $=function(id){return document.getElementById(id)};
function ls(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return{}}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var TT=["Rookie Learner","Curious Beginner","Word Collector","Character Hunter","Tone Tamer","Pinyin Pro","Vocab Explorer","Hanzi Hero","Mandarin Master","Dragon Scholar"],N=150,TOTAL=D.length;
function xp(){return +localStorage.getItem("hsk2xp")||0}
function td(){return new Date().toLocaleDateString("en-CA")}
var S=ls(("deck_"+DK)),mode="n",q=[],H=[],busy=false,view="s",card=$("card"),mochi=$("mochi");
var mc="#9be7d0";try{mc=localStorage.getItem("hsk2col")||mc}catch(e){}
function dk(h){var n=parseInt(h.slice(1),16);return"#"+[n>>16,n>>8&255,n&255].map(function(c){return Math.round(c*.85).toString(16).padStart(2,"0")}).join("")}
$("mbd").setAttribute("fill",mc);$("msp").setAttribute("fill",dk(mc));
var grid=$("grid");for(var i=0;i<TOTAL;i++)grid.appendChild(document.createElement("i"));var dots=grid.children;
var MOUTH={happy:"M58 82q12 12 24 0",oops:"M58 90q12-10 24 0",wow:"M64 82a6 7 0 1 0 12 0a6 7 0 1 0-12 0"};
function setMood(cls,mood,text){mochi.classList.remove("bounce","shake");void mochi.getBoundingClientRect();mochi.classList.add(cls);
$("mouth").setAttribute("d",MOUTH[mood]);
$("eyes").innerHTML=mood==="oops"?'<path d="M44 60l12 6"/><path d="M96 60l-12 6"/>':'<path d="M44 66q6-8 12 0"/><path d="M84 66q6-8 12 0"/>';
$("bubble").textContent=text}
function cnt(m){return D.filter(function(x){return m=="n"?!S[x.id]:S[x.id]==m}).length}
function build(){q=D.filter(function(x){return mode=="n"?!S[x.id]:S[x.id]==mode});if(mode!="n")q.sort(function(){return Math.random()-.5});H=[];render()}
function render(){
$("nK").textContent=cnt("k");$("nU").textContent=cnt("d");$("nN").textContent=cnt("n");
document.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c.dataset.m==mode)});
document.querySelectorAll(".seg button").forEach(function(b){b.classList.toggle("on",b.dataset.v==view)});
$("board").hidden=view!="s";$("allv").hidden=view!="a";
for(var i=0;i<TOTAL;i++){dots[i].className=S[i]=="k"?"k":S[i]=="d"?"u":""}
if(q.length)dots[q[0].id].classList.add("cur");
var X=xp(),L=Math.floor(X/N),M=L>=TT.length-1;
$("xpTxt").textContent=X+" XP";$("xpT").textContent="· "+TT[Math.min(L,TT.length-1)];
$("xpBar").style.width=Math.max(M?100:X%N/N*100,4)+"%";
$("xpNext").textContent=M?"Top title reached!":X%N+" / "+N+" XP to "+TT[L+1];
$("all").innerHTML=D.map(function(x){return'<div class="'+(S[x.id]=="k"?"k":S[x.id]=="d"?"u":"n")+'"><div>'+x.h+"</div><div>"+x.p+"</div><div>"+x.m+"</div></div>"}).join("");
var fin=!q.length;
$("done").classList.toggle("show",fin);card.style.display=fin?"none":"";
$("yes").disabled=$("no").disabled=fin;$("undo").disabled=!H.length;
$("u1").style.display=q.length>1?"":"none";$("u2").style.display=q.length>2?"":"none";
if(fin){$("dh").textContent=mode=="n"?"All sorted!":"Round done!";
$("doneTxt").textContent=mode=="n"?"Pick Known or Don't know above to practise those cards.":"You went through every card in this pile.";
$("again").style.display=mode=="n"?"none":"";return}
var c=q[0],k=c.h.length>4?" x":c.h.length>2?" s":"";
$("han").textContent=c.h;$("han2").textContent=c.h;$("han").className="han"+k;$("han2").className="han"+k;
$("pin").textContent=c.p;$("eng").textContent=c.m;
card.style.transition="none";card.className="card";card.style.cssText="transition:none";void card.offsetWidth;card.style.cssText="";card.classList.add("pop")}
card.addEventListener("animationend",function(){card.classList.remove("pop")});
function flip(){if(!busy&&q.length)card.classList.toggle("flipped")}
function sort(val){if(busy||!q.length)return;busy=true;var x=q[0];H.push([x,S[x.id]]);S[x.id]=val;ss(("deck_"+DK),S);
var c=ls("hsk2day"),dy=td();if(c.d!=dy)c={d:dy,n:0};c.n++;ss("hsk2day",c);var lg=ls("hsk2log");lg[dy]=(lg[dy]||0)+1;ss("hsk2log",lg);
var s2=ls("hsk2str");if(s2.l!=dy){var y=new Date();y.setDate(y.getDate()-1);s2={l:dy,n:s2.l==y.toLocaleDateString("en-CA")?(s2.n||0)+1:1};ss("hsk2str",s2)}
localStorage.setItem("hsk2xp",xp()+(val=="k"?10:5));
card.classList.add(val=="k"?"fly-r":"fly-l");
if(val=="k")setMood("bounce","wow","+10 XP! "+x.h+" is yours.");else setMood("shake","oops","+5 XP. "+x.h+" goes to your review pile.");
setTimeout(function(){q.shift();busy=false;render()},380)}
function undo(){if(busy||!H.length)return;var h=H.pop(),x=h[0];
localStorage.setItem("hsk2xp",Math.max(0,xp()-(S[x.id]=="k"?10:5)));
var c=ls("hsk2day");if(c.d==td()&&c.n>0){c.n--;ss("hsk2day",c)}var lg=ls("hsk2log");if(lg[td()]>0){lg[td()]--;ss("hsk2log",lg)}
if(h[1])S[x.id]=h[1];else delete S[x.id];ss(("deck_"+DK),S);q.unshift(x);
setMood("bounce","happy","Undone. Take another look.");render()}
var sx=0,dx=0,dn=false,moved=false;
card.addEventListener("pointerdown",function(e){if(busy||e.target.closest(".spk"))return;dn=true;moved=false;sx=e.clientX;dx=0;card.classList.add("drag");card.setPointerCapture(e.pointerId)});
card.addEventListener("pointermove",function(e){if(!dn)return;dx=e.clientX-sx;if(Math.abs(dx)>8)moved=true;if(moved){card.style.transform="translateX("+dx+"px) rotate("+(dx/18-1.2)+"deg)";card.style.filter=Math.abs(dx)>40?"drop-shadow(0 0 14px "+(dx>0?"#3fdcc8":"#ff8ee0")+")":""}});
card.addEventListener("pointerup",function(){if(!dn)return;dn=false;card.classList.remove("drag");card.style.filter="";card.style.transform="";if(moved&&Math.abs(dx)>90)sort(dx>0?"k":"d")});
card.addEventListener("click",function(e){if(e.target.closest(".spk"))return;if(moved){moved=false;return}flip()});
$("spk").addEventListener("click",function(e){e.stopPropagation();if(!window.speechSynthesis||!q.length)return;var u=new SpeechSynthesisUtterance(q[0].h.replace(/…/g,""));u.lang="zh-CN";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)});
$("yes").onclick=function(){sort("k")};$("no").onclick=function(){sort("d")};$("undo").onclick=undo;
$("again").onclick=function(){setMood("bounce","happy","Fresh round. Let's go!");build()};
$("sh").onclick=function(){q.sort(function(){return Math.random()-.5});render()};
$("rs").onclick=function(){if(confirm("Reset all progress?")){S={};ss(("deck_"+DK),S);mode="n";setMood("bounce","happy","Fresh start!");build()}};
document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){mode=c.dataset.m;build()}});
document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){view=b.dataset.v;render()}});
document.addEventListener("keydown",function(e){if(view!="s")return;if(e.key==="ArrowRight")sort("k");else if(e.key==="ArrowLeft")sort("d");else if(e.key===" "&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flip()}});
var _m=window.MOCHI&&MOCHI.A[MOCHI.load().a];if(_m)$("mochi").insertAdjacentHTML("beforeend","<g transform=\"translate(10,-6)\">"+_m+"</g>");
build();
})();
</script></body></html>
